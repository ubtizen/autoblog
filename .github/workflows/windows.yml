name: Windows executable

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install packaging tool
        run: python -m pip install pyinstaller==6.16.0
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Build standalone executable
        run: python -m PyInstaller --noconfirm --clean --onefile --console --name Autoblog windows_entry.py
      - name: Verify packaged CLI
        shell: pwsh
        run: |
          & .\dist\Autoblog.exe '파이썬 자동화' --offline --output smoke.md
          if ($LASTEXITCODE -ne 0) { throw 'Executable failed' }
          $text = Get-Content smoke.md -Raw -Encoding utf8
          if (-not $text.StartsWith('# 파이썬 자동화')) { throw 'Incorrect Markdown output' }
          & .\dist\Autoblog.exe '다른 주제' --offline --output smoke.md
          if ($LASTEXITCODE -eq 0) { throw 'Existing file was overwritten' }
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: Autoblog-Windows-x64
          path: dist/Autoblog.exe
          if-no-files-found: error
